{% extends "base.html" %}

{% block title %}Edit Application | Job Application Tracker{% endblock %}

{% block content %}
<h2>Edit Application</h2>

<!-- Show validation feedback while keeping the submitted values in the form. -->
{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}

<form method="post">
    <p>
        <label for="job_id">Job*</label>
        <select id="job_id" name="job_id" required>
            <option value="">Choose a job</option>
            {% for job in jobs %}
                <option
                    value="{{ job.job_id }}"
                    {% if job.job_id == application.job_id %}selected{% endif %}
                >
                    {{ job.job_title }} — {{ job.company_name }}
                </option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label for="application_date">Application date*</label>
        <input
            id="application_date"
            type="date"
            name="application_date"
            value="{{ application.application_date }}"
            required
        >
    </p>

    <p>
        <label for="status">Status</label>
        <select id="status" name="status">
            {% for status in ["Applied", "Screening", "Interview", "Offer", "Rejected", "Withdrawn"] %}
                <option
                    value="{{ status }}"
                    {% if application.status == status %}selected{% endif %}
                >
                    {{ status }}
                </option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label for="resume_version">Resume version</label>
        <input
            id="resume_version"
            name="resume_version"
            value="{{ application.resume_version or '' }}"
        >
    </p>

    <p>
        <label>
            <input
                type="checkbox"
                name="cover_letter_sent"
                value="1"
                {% if application.cover_letter_sent %}checked{% endif %}
            >
            Cover letter sent
        </label>
    </p>

    <p>
        <label for="interview_notes">Interview notes</label>
        <textarea id="interview_notes" name="interview_notes">{{ application.interview_notes or '' }}</textarea>
    </p>

    <button type="submit">Save Changes</button>
</form>

<p><a href="{{ url_for('applications') }}">Back to Applications</a></p>
{% endblock %}
